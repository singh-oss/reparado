<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Segoe UI",Inter,Roboto,sans-serif}
body{width:1200px;height:630px;overflow:hidden;background:linear-gradient(135deg,#0e7a3c 0%,#0a5c2d 60%,#083f20 100%);color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:20px;margin-bottom:40px}
.logo{width:88px;height:88px;border-radius:22px;background:#fff;color:#0e7a3c;display:grid;place-items:center;font-weight:900;font-size:56px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.name{font-size:52px;font-weight:900;letter-spacing:-1px}
h1{font-size:66px;font-weight:900;line-height:1.08;letter-spacing:-2px;max-width:900px}
.sub{margin-top:26px;font-size:31px;font-weight:500;color:rgba(255,255,255,.92);max-width:880px;line-height:1.35}
.pills{margin-top:44px;display:flex;gap:16px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:14px 26px;border-radius:999px;font-size:25px;font-weight:600}
.url{position:absolute;bottom:56px;right:80px;font-size:30px;font-weight:800;opacity:.95}
</style></head><body>
<div class="grid"></div>
<div class="wrap">
  <div class="brand"><div class="logo">V</div><div class="name">Velqio</div></div>
  <h1>Die einfache Software für Reparaturwerkstätten</h1>
  <div class="sub">Aufträge, Kunden, Lager, Kasse & automatische Erinnerungen – alles an einem Ort.</div>
  <div class="pills"><div class="pill">📋 Aufträge</div><div class="pill">🔧 Lager</div><div class="pill">💳 Kasse</div><div class="pill">🔔 Kunden-Erinnerungen</div></div>
</div>
<div class="url">velqio.de</div>
</body></html>
