<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reparatur anfragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0f2318;--ink2:#5f6b64;--line:#e7ebe8;--soft:#f5f8f6;--green:#0e7a3c;--green2:#12a24c;--ring:0 0 0 3px rgba(14,122,60,.15)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
  [dir=rtl]{letter-spacing:0}
  svg{display:block}
  .top{border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#fff;z-index:6}
  .top .dot{width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
  .top b{font-size:16px;letter-spacing:-.3px}
  .lang{margin-inline-start:auto;position:relative}
  .lang button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit}
  .lang .menu{position:absolute;inset-inline-end:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.12);padding:6px;min-width:170px;z-index:20;display:none}
  .lang .menu.on{display:block}
  .lang .menu a{display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
  .lang .menu a:hover{background:var(--soft)}
  .wrap{max-width:760px;margin:0 auto;padding:18px 18px 70px}
  /* Stepper */
  .stepper{display:flex;align-items:center;gap:0;margin:8px 0 22px;overflow-x:auto;padding:4px 2px}
  .stp{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;min-width:64px}
  .stp .cir{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--ink2);background:#fff;transition:.15s}
  .stp .cir svg{width:18px;height:18px}
  .stp .lbl{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .stp.on .cir{border-color:var(--green);background:var(--green);color:#fff}
  .stp.done .cir{border-color:var(--green);background:#eaf6ee;color:var(--green)}
  .stp.on .lbl,.stp.done .lbl{color:var(--ink)}
  .stpline{flex:1;height:2px;background:var(--line);min-width:12px;margin-top:-18px}
  .stpline.done{background:var(--green)}
  h1{font-size:24px;letter-spacing:-.6px;margin-bottom:4px;text-align:center}
  h1 .hl{color:var(--green)}
  .sub{color:var(--ink2);margin-bottom:18px;text-align:center;font-size:14px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:640px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
  /* Category / generic tiles */
  .cat{border:1px solid var(--line);border-radius:16px;padding:18px 10px;cursor:pointer;transition:.14s;text-align:center;background:#fff;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .cat:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 8px 22px rgba(14,122,60,.08)}
  .cat.on{border-color:var(--green);box-shadow:var(--ring)}
  .cat .ic{width:38px;height:38px;color:var(--ink)}
  .cat.on .ic{color:var(--green)}
  /* Brand tiles */
  .brand{border:1px solid var(--line);border-radius:14px;padding:20px 10px;cursor:pointer;transition:.14s;text-align:center;background:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:92px;justify-content:center}
  .brand:hover{border-color:var(--green);transform:translateY(-2px)}
  .brand.on{border-color:var(--green);box-shadow:var(--ring)}
  .brand .wm{font-weight:800;font-size:17px;letter-spacing:-.4px}
  .brand .mono{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
  /* Model cards */
  .mcard{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.14s;background:#fff;display:flex;align-items:center;gap:12px;text-align:start}
  .mcard:hover{border-color:var(--green)}
  .mcard.on{border-color:var(--green);box-shadow:var(--ring)}
  .mcard .thumb{width:50px;height:50px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;color:#8a968f}
  .mcard .thumb img{width:100%;height:100%;object-fit:contain;border-radius:10px}
  .mcard .mn{font-weight:800;font-size:15px}
  .mcard .mnr{font-size:11px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
  .mcard .dots{display:flex;gap:5px;margin-top:5px}
  .mcard .dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block}
  /* Repair cards */
  .rcard{border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.14s;background:#fff;position:relative;display:flex;flex-direction:column;gap:8px}
  .rcard:hover{border-color:var(--green)}
  .rcard.on{border-color:var(--green);box-shadow:var(--ring);background:#fbfefc}
  .rcard .rico{width:34px;height:34px;color:var(--green)}
  .rcard .rname{font-weight:800;font-size:15px}
  .rcard .rmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}
  .rcard .rdesc{font-size:12.5px;color:#4a564f;line-height:1.5}
  .rcard .rpick{position:absolute;inset-inline-end:12px;top:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
  .rcard.on .rpick{background:var(--green);border-color:var(--green)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
  .badge.dur{background:var(--soft);color:#3a463f}
  .badge.q{background:#eaf6ee;color:var(--green)}
  .badge.price{background:#fff5e6;color:#b45309}
  /* Selection summary */
  .selbar{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:linear-gradient(180deg,#fbfefc,#fff);margin-bottom:16px;display:flex;align-items:center;gap:12px}
  .selbar .thumb{width:46px;height:46px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;color:#8a968f}
  .selbar .thumb img{width:100%;height:100%;object-fit:contain;border-radius:10px}
  .selbar .t{font-size:11px;font-weight:800;color:var(--green);letter-spacing:.4px}
  .selbar .m{font-weight:800;font-size:15px;margin-top:1px}
  .selbar .d{font-size:12px;color:var(--ink2);margin-top:1px}
  /* Inputs */
  .in{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:0;font-size:15px;font-family:inherit;background:#fff}
  .in:focus{border-color:var(--green);box-shadow:var(--ring)}
  textarea.in{min-height:84px;resize:vertical}
  label{font-size:12px;font-weight:700;color:#333;display:block;margin-top:16px;margin-bottom:4px}
  .search{position:relative;margin-bottom:14px}
  .search input{padding-inline-start:40px}
  .search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--ink2);width:18px;height:18px}
  .toggle{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:22px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:13px;user-select:none}
  .toggle .sw{width:34px;height:20px;border-radius:20px;background:#d7ddd9;position:relative;transition:.15s;flex:none}
  .toggle .sw i{position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
  .toggle.on .sw{background:var(--green)}.toggle.on .sw i{inset-inline-start:16px}
  .nav{display:flex;gap:10px;margin-top:24px}
  .btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;transition:.12s}
  .btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.pri:hover{background:#0c6a34}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{flex:none;padding-inline:18px}
  .note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13px;color:#4a564f;margin-top:16px}
  .chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:#4a564f}
  .chk input{margin-top:2px;width:18px;height:18px;flex:none;accent-color:var(--green)}
  .summary{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:8px}
  .summary .r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);gap:12px;font-size:14px}
  .summary .r:last-child{border:0}.summary .r b{font-weight:800;text-align:end}
  .donescreen{text-align:center;padding:26px 6px}
  .donescreen .ck{width:66px;height:66px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
  .callnow{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:14px}
  .callnow a{color:var(--green);font-weight:800;text-decoration:none;margin-inline-start:auto}
  .foot{text-align:center;color:var(--ink2);font-size:12px;margin-top:26px}
  body.embedded{background:transparent}body.embedded .top{position:static}
  .empty{color:var(--ink2);font-size:14px;text-align:center;padding:18px}
</style>
</head>

<div class="top"><span class="dot" id="wsDot">W</span><b id="wsName">Werkstatt</b>

  <div class="foot" id="wsFoot"></div>
</div>

const MONO=['#0e7a3c','#2563eb','#d97706','#7c3aed','#dc2626','#0891b2','#be185d','#4338ca','#15803d','#b45309'];
function monoColor(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return MONO[h%MONO.length];}

/* ---------- State ---------- */
const state={step:1,cat:'',brand:'',model:'',color:'',repairs:[],b2b:false,problem:'',name:'',tel:'',mail:'',bsearch:'',msearch:'',rsearch:''};
const STEPS=[['cat','Kategorie',ICONS.Sonstiges],['brand','Gerät',ICONS.Smartphone],['model','Modell',ICONS.Tablet],['rep','Reparatur',RICONS.display],['data','Daten',SVG('<path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="8" r="4"/>')]];
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function qa(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function brands(){return CATALOG[state.cat]||{'Andere Marke':['Anderes Gerät']};}
function models(){return (brands()[state.brand]||[]);}
function catThumb(){const m=state.model;return `<div style="color:#8a968f;width:100%;height:100%">${ICONS[state.cat]||ICONS.Sonstiges}</div>`;}

/* ---------- Stepper ---------- */
function renderStepper(){
  const cur=state.step; let h='';
  STEPS.forEach((s,ix)=>{const n=ix+1;const cls=n===cur?'on':(n<cur?'done':'');
    h+=`<div class="stp ${cls}"><div class="cir">${n<cur?CK.replace('width="32" height="32"','width="16" height="16"'):(n===cur?`<span style="width:16px;height:16px">${s[2]}</span>`:n)}</div><div class="lbl">${s[1]}</div></div>`;
    if(ix<STEPS.length-1)h+=`<div class="stpline ${n<cur?'done':''}"></div>`;
  });
  document.getElementById('stepper').innerHTML=h;
}

/* ---------- Selection bar ---------- */
function selBar(){
  if(!state.model&&!state.brand)return '';
  const reps=state.repairs.map(id=>{const r=REPAIRS.find(x=>x.id===id);return r?r.name:'';}).filter(Boolean).join(', ');
  return `<div class="selbar"><div class="thumb">${ICONS[state.cat]||ICONS.Sonstiges}</div>
    <div style="min-width:0"><div class="t">${t('yourSel')}</div>
      <div class="m">${esc([state.brand,state.model].filter(Boolean).join(' '))||esc(state.cat)}</div>
      <div class="d">${[state.color?esc(state.color.split('|')[1]||state.color):'',reps].filter(Boolean).join(' · ')||esc(state.cat)}</div></div></div>`;
}

/* ---------- Render ---------- */
function render(){
  renderStepper();
  document.documentElement.dir = (LANG==='ar')?'rtl':'ltr';
  const v=document.getElementById('view');
  if(state.step===1){
    v.innerHTML=`<h1>${t('cat')}</h1><p class="sub">${t('subCat')}</p>
      <div class="grid g4">${CATS.map(c=>`<div class="cat ${state.cat===c?'on':''}" onclick="pickCat('${qa(c)}')"><span class="ic">${ICONS[c]||ICONS.Sonstiges}</span>${esc(c)}</div>`).join('')}</div>`;
  } else if(state.step===2){
    const list=Object.keys(brands()).filter(b=>b.toLowerCase().includes(state.bsearch.toLowerCase()));
    v.innerHTML=`<h1>${t('brand')}</h1><p class="sub">${t('subBrand')}</p>
      <div class="search">${SEARCHI}<input class="in" placeholder="${t('searchBrand')}" value="${esc(state.bsearch)}" oninput="state.bsearch=this.value;renderBody()"></div>
      <div class="grid g4" id="brandGrid">${brandTiles(list)}</div>
      <div class="nav"><button class="btn ghost" onclick="setStep(1)">${t('back')}</button></div>`;
  } else if(state.step===3){
    const ml=models().filter(m=>m.toLowerCase().includes(state.msearch.toLowerCase()));
    v.innerHTML=`${selBar()}<h1>${t('model')}</h1><p class="sub">${t('subModel')}</p>
      <div class="search">${SEARCHI}<input class="in" placeholder="${t('searchModel')}" value="${esc(state.msearch)}" oninput="state.msearch=this.value;renderBody()"></div>
      <div class="grid g2" id="modelGrid">${modelCards(ml)}</div>
      <div class="nav"><button class="btn ghost" onclick="setStep(2)">${t('back')}</button></div>`;
  } else if(state.step===4){
    const rl=REPAIRS.filter(r=>r.name.toLowerCase().includes(state.rsearch.toLowerCase()));
    v.innerHTML=`${selBar()}<h1>${t('rep')}</h1><p class="sub">${t('subRep')}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <div class="search" style="flex:1;margin:0;min-width:180px">${SEARCHI}<input class="in" placeholder="${t('searchRep')}" value="${esc(state.rsearch)}" oninput="state.rsearch=this.value;renderBody()"></div>
        <div class="toggle ${state.b2b?'on':''}" onclick="state.b2b=!state.b2b;render()"><span class="sw"><i></i></span>${t('b2b')}</div>
      </div>
      <div class="grid g2" id="repGrid">${repCards(rl)}</div>
      <label>${t('concern')} – ${t('optional')}</label>
      <textarea class="in" id="pb" placeholder="${t('subData')}" oninput="state.problem=this.value">${esc(state.problem)}</textarea>
      <div class="nav"><button class="btn ghost" onclick="grabProblem();setStep(3)">${t('back')}</button><button class="btn pri" ${state.repairs.length?'':'disabled'} onclick="grabProblem();setStep(5)">${t('next')}</button></div>`;
  } else if(state.step===5){
    const reps=state.repairs.map(id=>{const r=REPAIRS.find(x=>x.id===id);return r?r.name:'';}).filter(Boolean).join(', ');
    v.innerHTML=`<h1>${t('data')}</h1><p class="sub">${t('subData')}</p>
      <div class="summary">
        <div class="r"><span>${t('device')}</span><b>${esc([state.brand,state.model].filter(Boolean).join(' '))}${state.color?' · '+esc(state.color.split('|')[1]||''):''}</b></div>
        <div class="r"><span>${t('concern')}</span><b>${esc(reps)}</b></div>
        ${state.b2b?`<div class="r"><span>B2B</span><b>✓</b></div>`:''}
        ${state.problem?`<div class="r"><span>Info</span><b>${esc(state.problem)}</b></div>`:''}
      </div>
      <label>${t('name')}</label><input class="in" id="n" value="${esc(state.name)}" placeholder="${t('namePh')}">
      <label>${t('tel')}</label><input class="in" id="tl" value="${esc(state.tel)}" placeholder="${t('telPh')}">
      <label>${t('mail')} ${t('optional')}</label><input class="in" id="ml" value="${esc(state.mail)}" placeholder="${t('mailPh')}">
      <div class="chk"><input type="checkbox" id="dsg"><label for="dsg" style="margin:0;font-weight:500;color:#4a564f">${t('consent')}</label></div>
      <div class="note">${t('noteData')}</div>
      <div class="nav"><button class="btn ghost" onclick="setStep(4)">${t('back')}</button><button class="btn pri" id="sendBtn" onclick="submit()">${t('send')}</button></div>`;
  } else if(state.step===6){
    const reps=state.repairs.map(id=>{const r=REPAIRS.find(x=>x.id===id);return r?r.name:'';}).filter(Boolean).join(', ');
    v.innerHTML=`<div class="donescreen"><div class="ck">${CK}</div>
      <h1>${t('doneT')}</h1><p class="sub">${t('doneS').replace('{n}',esc(state.name.split(' ')[0]||''))}</p>
      <div class="summary" style="text-align:start">
        <div class="r"><span>${t('device')}</span><b>${esc([state.brand,state.model].filter(Boolean).join(' '))}</b></div>
        <div class="r"><span>${t('concern')}</span><b>${esc(reps)}</b></div>
      </div>
      <div class="note">${t('noteDone')}</div>
      <div class="nav"><button class="btn pri" onclick="resetAll()">${t('newReq')}</button></div></div>`;
  }
  postH();
}
function renderBody(){ /* Teil-Neuzeichnen der Grids (Suche) ohne Fokusverlust der Sucheingabe */
  if(state.step===2){const list=Object.keys(brands()).filter(b=>b.toLowerCase().includes(state.bsearch.toLowerCase()));const g=document.getElementById('brandGrid');if(g)g.innerHTML=brandTiles(list);}
  else if(state.step===3){const ml=models().filter(m=>m.toLowerCase().includes(state.msearch.toLowerCase()));const g=document.getElementById('modelGrid');if(g)g.innerHTML=modelCards(ml);}
  else if(state.step===4){const rl=REPAIRS.filter(r=>r.name.toLowerCase().includes(state.rsearch.toLowerCase()));const g=document.getElementById('repGrid');if(g)g.innerHTML=repCards(rl);}
}
function brandTiles(list){
  if(!list.length)return `<div class="empty" style="grid-column:1/-1">—</div>`;
  return list.map(b=>`<div class="brand ${state.brand===b?'on':''}" onclick="pickBrand('${qa(b)}')"><div class="mono" style="background:${monoColor(b)}">${esc(b.trim()[0]||'?')}</div><div class="wm" style="font-size:14px">${esc(b)}</div></div>`).join('');
}
function modelCards(list){
  const cards=list.map(m=>{const nr=MODELNR[m];const cols=COLORS[m]||[];
    return `<div class="mcard ${state.model===m?'on':''}" onclick="pickModel('${qa(m)}')">
      <div class="thumb">${ICONS[state.cat]||ICONS.Sonstiges}</div>
      <div style="min-width:0"><div class="mn">${esc(m)}</div>${nr?`<div class="mnr">${esc(nr)}</div>`:''}
      ${cols.length?`<div class="dots">${cols.slice(0,5).map(c=>`<i style="background:${c.split('|')[0]}"></i>`).join('')}</div>`:''}</div></div>`;}).join('');
  return cards+`<div class="mcard" onclick="pickModel('__other__')"><div class="thumb">${RICONS.other}</div><div><div class="mn">${t('other')}</div></div></div>`;
}
function repCards(list){
  return list.map(r=>{const on=state.repairs.includes(r.id);
    return `<div class="rcard ${on?'on':''}" onclick="toggleRep('${r.id}')">
      <div class="rpick">${on?CK.replace('width="32" height="32"','width="14" height="14"'):''}</div>
      <div class="rico">${RICONS[r.key]||RICONS.other}</div>
      <div class="rname">${esc(r.name)}</div>
      <div class="rmeta">${r.dur?`<span class="badge dur">⏱ ${esc(r.dur)} ${t('min')}</span>`:''}${r.part?`<span class="badge q">${LANG==='de'?'Original / Ersatzteil':'Original / OEM'}</span>`:''}<span class="badge price">${t('price')}</span></div>
      <div class="rdesc">${esc(r.desc)}</div></div>`;}).join('');
}

/* ---------- Actions ---------- */
function pickCat(c){state.cat=c;state.brand='';state.model='';state.color='';state.bsearch='';setStep(2);}
function pickBrand(b){state.brand=b;state.model='';state.color='';state.msearch='';setStep(3);}
function pickModel(m){
  if(m==='__other__'){state.model='';const nm=prompt(t('searchModel'));if(nm)state.model=nm;else return;}
  else state.model=m;
  const cols=COLORS[state.model]||[];
  if(cols.length){state.color='';showColor(cols);}
  else{state.color='';setStep(4);}
}
function showColor(cols){
  const v=document.getElementById('view');
  v.innerHTML=`${selBar()}<h1>${t('color')}</h1><p class="sub">${esc([state.brand,state.model].filter(Boolean).join(' '))}</p>
    <div class="grid g2">${cols.map(c=>{const [hex,name]=c.split('|');return `<div class="opt-color mcard" onclick="pickColor('${qa(c)}')"><div class="thumb" style="background:${hex};border:1px solid rgba(0,0,0,.12)"></div><div class="mn">${esc(name)}</div></div>`;}).join('')}</div>
    <div class="nav"><button class="btn ghost" onclick="setStep(3)">${t('back')}</button><button class="btn pri" onclick="setStep(4)">${t('next')} ›</button></div>`;
  postH();
}
function pickColor(c){state.color=c;setStep(4);}
function toggleRep(id){const i=state.repairs.indexOf(id);if(i>=0)state.repairs.splice(i,1);else state.repairs.push(id);renderBody();}
function grabProblem(){const p=document.getElementById('pb');if(p)state.problem=p.value;}
function setStep(n){state.step=n;render();window.scrollTo(0,0);}
function resetAll(){Object.assign(state,{step:1,cat:'',brand:'',model:'',color:'',repairs:[],b2b:false,problem:'',name:'',tel:'',mail:'',bsearch:'',msearch:'',rsearch:''});render();}

function submit(){
  state.name=document.getElementById('n').value.trim();
  state.tel=document.getElementById('tl').value.trim();
  state.mail=document.getElementById('ml').value.trim();
  if(!state.name||!state.tel){alert(t('errName'));return;}
  if(!document.getElementById('dsg').checked){alert(t('errConsent'));return;}
  const reps=state.repairs.map(id=>{const r=REPAIRS.find(x=>x.id===id);return r?r.name:'';}).filter(Boolean);
  const issue=reps.join(', ')||'Anfrage';
  const rq={name:state.name,tel:state.tel,mail:state.mail,type:state.cat,brand:state.brand,model:state.model+(state.color?(' · '+(state.color.split('|')[1]||'')):''),issue:issue,problem:state.problem,contact:'Rückruf',besttime:'',b2b:state.b2b,lang:LANG,repairs:reps,at:new Date().toISOString(),ts:Date.now()};
  const w=new URLSearchParams(location.search).get('w');
  const localSave=function(){try{const arr=JSON.parse(localStorage.getItem('reparado_requests')||'[]');arr.push(rq);localStorage.setItem('reparado_requests',JSON.stringify(arr));}catch(e){}if(window.parent!==window){try{window.parent.postMessage({reparadoRequest:rq},'*');}catch(e){}}};
  if(w){
    const btn=document.getElementById('sendBtn');if(btn){btn.disabled=true;btn.textContent=t('sending');}
    fetch('/api/intake/public',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:w,herkunft:'website',data:rq})})
      .then(r=>r.json().catch(()=>({}))).then(res=>{ if(res&&res.ok){setStep(6);} else {if(btn){btn.disabled=false;btn.textContent=t('send');}alert((res&&res.error)||t('errSend'));} })
      .catch(()=>{if(btn){btn.disabled=false;btn.textContent=t('send');}alert(t('errSend'));});
    return;
  }
  localSave();setStep(6);
}

/* ---------- Language ---------- */
function buildLangMenu(){document.getElementById('langMenu').innerHTML=LANGS.map(l=>`<a onclick="setLang('${l[0]}')"><span>${l[1]}</span>${l[2]}</a>`).join('');}
function toggleLang(){document.getElementById('langMenu').classList.toggle('on');}
function setLang(code){LANG=code;const l=LANGS.find(x=>x[0]===code)||LANGS[0];document.getElementById('langFlag').textContent=l[1];document.getElementById('langName').textContent=l[2];document.getElementById('langMenu').classList.remove('on');try{localStorage.setItem('anfrage_lang',code);}catch(e){}render();}
document.addEventListener('click',e=>{if(!e.target.closest('.lang'))document.getElementById('langMenu').classList.remove('on');});

/* ---------- Embed / workshop ---------- */
function postH(){if(window.parent!==window){try{window.parent.postMessage({reparadoHeight:Math.ceil(document.documentElement.getBoundingClientRect().height)+2},'*');}catch(e){}}}
try{if(window.ResizeObserver)new ResizeObserver(postH).observe(document.body);}catch(e){}
window.addEventListener('load',postH);window.addEventListener('resize',postH);
if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embedded');
function setWsName(ws){if(!ws)return;const n=document.getElementById('wsName');if(n)n.textContent=ws;const d=document.getElementById('wsDot');if(d)d.textContent=(ws.trim()[0]||'W').toUpperCase();}
(function(){
  buildLangMenu();
  try{const sl=localStorage.getItem('anfrage_lang');if(sl&&I18N[sl])setLang(sl);}catch(e){}
  const q=new URLSearchParams(location.search);const ws=q.get('ws');
  if(ws){setWsName(ws);document.title='Anfrage · '+ws;}
  const tel=q.get('tel');if(tel){const tl=document.getElementById('wsTel');const c=document.getElementById('wsCall');const ct=document.getElementById('callTxt');if(ct)ct.textContent=t('callHint');if(tl){tl.textContent=tel;tl.href='tel:'+tel.replace(/\s/g,'');}if(c)c.style.display='';}
  const w=q.get('w');if(w&&!ws){try{fetch('/api/intake/info?key='+encodeURIComponent(w)).then(r=>r.ok?r.json():null).then(res=>{if(res&&res.name){setWsName(res.name);document.title='Anfrage · '+res.name;}}).catch(()=>{});}catch(e){}}
  render();
})();
</script>
