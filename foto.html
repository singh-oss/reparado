<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Fotos zur Geräteannahme</title>
<style>
:root{--acc:#16a34a;--acc2:#0f7a37;--ink:#0f2318;--ink2:#5f6b64;--line:#e3e8e4;--soft:#f4f7f5;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:#eef2ef;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.head{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:14px;padding:18px 16px;margin-top:14px}
.head h1{margin:0;font-size:19px}.head p{margin:4px 0 0;opacity:.9;font-size:13px}
h2{font-size:15px;margin:0 0 8px}
.muted{color:var(--ink2)}.sm{font-size:13px}.xs{font-size:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:700;cursor:pointer;text-align:center}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:disabled{background:#a9c9b4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid .th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.grid .th img{width:100%;height:100%;object-fit:cover;display:block}
.grid .th .ok{position:absolute;right:4px;bottom:4px;background:var(--acc);color:#fff;border-radius:20px;font-size:11px;padding:1px 6px}
.grid .th.up{opacity:.55}
.err{background:#fdecea;color:#8a1c13;border:1px solid #f5c6c2;border-radius:10px;padding:12px;font-size:14px;margin-top:14px}
.count{background:#e9f5ec;color:#0f7a37;border-radius:10px;padding:10px;font-size:14px;font-weight:700;text-align:center;margin-top:12px}
.foot{text-align:center;color:var(--ink2);font-size:11px;margin-top:22px}
.hint{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;color:#41504a;line-height:1.5;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><p class="muted">Lädt…</p></div></div>
<script>
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function token(){var m=location.search.match(/[?&]t=([^&]+)/);return m?decodeURIComponent(m[1]):'';}
var T=token(), COUNT=0, THUMBS=[];

function screenError(msg){ $('app').innerHTML='<div class="head"><h1>Fotos zur Annahme</h1></div><div class="card"><div class="err">'+esc(msg)+'</div><p class="muted sm" style="margin-top:12px">Bitte scannen Sie den QR-Code am PC erneut.</p></div>'; }

function render(){
  $('app').innerHTML=
   '<div class="head"><h1>Fotos zur Geräteannahme</h1><p>Mit diesem Handy fotografieren – die Bilder erscheinen sofort am PC.</p></div>'+
   '<div class="card">'+
     '<label class="btn pri" for="fileIn">📷 Foto aufnehmen / auswählen</label>'+
     '<input id="fileIn" type="file" accept="image/*" capture="environment" multiple style="display:none">'+
     '<div class="hint">Tipp: Du kannst mehrere Fotos nacheinander machen. Jedes Foto wird automatisch hochgeladen und erscheint direkt am PC im Auftrag.</div>'+
     '<div id="count"></div>'+
     '<div class="grid" id="grid"></div>'+
   '</div>'+
   '<div id="errbox"></div>'+
   '<div class="foot">Sichere Übertragung · Velqio</div>';
  $('fileIn').addEventListener('change',onPick);
  updCount();
}
function updCount(){ $('count').innerHTML = COUNT? '<div class="count">✓ '+COUNT+' Foto'+(COUNT>1?'s':'')+' hochgeladen</div>' : ''; }
function drawGrid(){ $('grid').innerHTML=THUMBS.map(function(t){return '<div class="th'+(t.up?' up':'')+'"><img src="'+t.src+'">'+(t.up?'':'<span class="ok">✓</span>')+'</div>';}).join(''); }

function toJpeg(file,cb){
  var rd=new FileReader();
  rd.onload=function(){ var im=new Image(); im.onload=function(){
    var max=1400, w=im.width, h=im.height;
    if(w>=h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>w&&h>max){w=Math.round(w*max/h);h=max;}
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',0.85));
  }; im.onerror=function(){cb(null);}; im.src=rd.result; };
  rd.onerror=function(){cb(null);};
  rd.readAsDataURL(file);
}

function onPick(e){
  var files=Array.prototype.slice.call(e.target.files||[]); if(!files.length)return;
  e.target.value='';
  files.forEach(function(f){
    toJpeg(f,function(j){
      if(!j){ return; }
      var idx=THUMBS.length; THUMBS.push({src:j,up:true}); drawGrid();
      fetch('/api/photo/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,photo:j})})
        .then(function(r){return r.json();}).then(function(res){
          if(res&&res.ok){ THUMBS[idx].up=false; COUNT=res.count||(COUNT+1); drawGrid(); updCount(); }
          else { THUMBS.splice(idx,1); drawGrid(); $('errbox').innerHTML='<div class="err">'+esc((res&&res.error)||'Foto konnte nicht gesendet werden.')+'</div>'; }
        }).catch(function(){ THUMBS[idx]&&(THUMBS.splice(idx,1)); drawGrid(); $('errbox').innerHTML='<div class="err">Verbindungsproblem – bitte erneut versuchen.</div>'; });
    });
  });
}

if(!T){ screenError('Kein gültiger Foto-Link. Bitte scannen Sie den QR-Code am PC.'); }
else { render(); }
</script>
</body>
</html>
