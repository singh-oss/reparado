<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reparado · Werkstatt-Software</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --ink:#0f2318; --ink2:#5f6b64; --line:#eaedeb; --line2:#f1f3f2;
    --soft:#f5f8f6; --soft2:#eef2ef; --white:#fff;
    --green:#0e7a3c; --green-d:#0b6733; --green-tint:#eaf4ee; --black:#0e7a3c;
    --radius:16px;
    --shadow:0 1px 2px rgba(16,40,27,.04),0 6px 16px rgba(16,40,27,.05),0 18px 40px rgba(16,40,27,.04);
    --shadow-sm:0 1px 2px rgba(16,40,27,.05),0 4px 12px rgba(16,40,27,.05);
    --ring:0 0 0 3px rgba(14,122,60,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit}
  svg{display:block}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#d5ddd8;border-radius:20px}
  ::-webkit-scrollbar-thumb:hover{background:#c2cdc6}
  ::selection{background:rgba(14,122,60,.14)}

  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
  .side{border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--white)}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:800;letter-spacing:-.5px;font-size:20px}
  .brand .dot{width:26px;height:26px;border-radius:8px;background:var(--black);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:600}
  .nav a .ic{width:18px;height:18px;flex:none;color:currentColor}
  .nav a:hover{background:var(--soft)}
  .nav a.active{background:var(--green-tint);color:var(--green)}
  .nav a.active .ic{color:var(--green)}
  .nav .grouplbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#9aa8a0;padding:16px 12px 6px;font-weight:700}
  .nav a .badge{margin-left:auto;background:var(--green);color:#fff;font-size:11px;border-radius:20px;padding:1px 7px;font-weight:700;font-variant-numeric:tabular-nums}
  .nav a.active .badge{background:var(--green);color:#fff}

  .main{min-width:0;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(16px);
       border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px}
  .top .search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid transparent;border-radius:11px;padding:9px 12px;color:var(--ink2);transition:.14s}
  .top .search:focus-within{border-color:var(--green);background:#fff;box-shadow:var(--ring)}
  .top .search input{border:0;background:transparent;outline:0;width:100%;color:var(--ink)}
  .top .sp{flex:1}
  .content{padding:24px 26px 60px;max-width:1180px;width:100%}

  .h1{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:0}
  .sub{color:var(--ink2);margin:3px 0 0}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:11px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.14s ease;box-shadow:0 1px 1.5px rgba(16,40,27,.04)}
  .btn:hover{border-color:#cfe0d5;background:var(--green-tint)}
  .btn:focus-visible{outline:none;box-shadow:var(--ring)}
  .btn.pri{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 1px 2px rgba(11,103,51,.28),0 6px 16px rgba(14,122,60,.20)}
  .btn.pri:hover{background:var(--green-d);border-color:var(--green-d)}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
  .btn.gho{border-color:transparent;background:transparent;box-shadow:none}
  .btn.gho:hover{background:var(--soft)}
  .btn .ic{width:16px;height:16px}
  .card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:18px;box-shadow:var(--shadow-sm)}
  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  .muted{color:var(--ink2)}
  .kpi .n{font-size:31px;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
  .kpi .l{color:var(--ink2);font-size:13px;margin-top:3px}
  .kpi .t{font-size:12px;font-weight:700;margin-top:8px;color:var(--green)}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid #0e7a3c;white-space:nowrap}
  .pill .d{width:7px;height:7px;border-radius:50%;background:#0e7a3c}
  .pill.solid{background:#0e7a3c;color:#fff}
  .pill.solid .d{background:#fff}
  .pill.soft{border-color:var(--line);color:var(--ink2)}
  .pill.soft .d{background:#bdbdbd}
  .pill.dash{border-style:dashed}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#9aa8a0;font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line)}
  td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--soft)}
  .tag{font-size:11px;font-weight:700;background:var(--soft2);border-radius:7px;padding:3px 8px;color:var(--ink2)}
  .avatar{width:34px;height:34px;border-radius:9px;background:#0e7a3c;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .avatar.out{background:#fff;color:#0e7a3c;border:1px solid #0e7a3c}
  .seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-weight:600;color:var(--ink2)}
  .seg button.on{background:#0e7a3c;color:#fff}
  label.f{display:block;font-size:12px;font-weight:700;color:#333;margin:0 0 5px}
  .in{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:0;background:#fff;transition:.14s;color:var(--ink)}
  .in:focus{border-color:var(--green);box-shadow:var(--ring)}
  .divider{height:1px;background:var(--line);margin:16px 0}
  .empty{text-align:center;color:var(--ink2);padding:40px 10px}
  .switch{width:42px;height:24px;border-radius:20px;background:#d9d9d9;position:relative;transition:.15s;flex:none;border:0}
  .switch.on{background:#0e7a3c}
  .switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on i{left:21px}

  .scrim{position:fixed;inset:0;background:rgba(15,35,24,.30);backdrop-filter:blur(2px);z-index:50;display:none}
  .scrim.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:560px;max-width:94vw;background:#fff;z-index:60;
          box-shadow:-24px 0 60px rgba(16,40,27,.16);transform:translateX(100%);transition:.24s cubic-bezier(.22,.61,.36,1);overflow:auto}
  .drawer.show{transform:none}
  .drawer .dhead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:12px}
  .drawer .dbody{padding:20px}
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:16px;max-width:580px;width:100%;max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0e7a3c;color:#fff;
         padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .listitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .listitem:last-child{border-bottom:0}
  .mono{font-variant-numeric:tabular-nums}
  .chip{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
  .chip.on{background:#0e7a3c;color:#fff;border-color:#0e7a3c}
  .bar{height:8px;background:var(--soft2);border-radius:20px;overflow:hidden}
  .bar > i{display:block;height:100%;background:#0e7a3c;border-radius:20px}
  .integ{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px}
  .integ .lg{width:44px;height:44px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:800;flex:none;font-size:13px}
  .note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13px;color:#444}
  .note b{color:#0e7a3c}

  .mailprev{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mailprev .mh{background:var(--soft);padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
  .mailprev .mb{padding:18px 16px;white-space:pre-wrap;font-size:14px;line-height:1.6}

  .democtl{position:fixed;left:50%;top:74px;transform:translateX(-50%);background:#0e7a3c;color:#fff;border-radius:14px;padding:12px 16px;z-index:85;display:flex;gap:16px;align-items:center;max-width:92vw;box-shadow:var(--shadow)}
  .democtl .txt b{font-weight:800}
  .democtl .stop{border:1px solid #fff;background:transparent;color:#fff;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer;flex:none}
  .democtl .stop:hover{background:#fff;color:#0e7a3c}
  .callhdr{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}
  .dotpulse{width:12px;height:12px;border-radius:50%;background:#0e7a3c;flex:none;animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,0,0,.35)}70%{box-shadow:0 0 0 8px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
  .callchat{display:flex;flex-direction:column;gap:9px;max-height:46vh;overflow:auto;padding:4px}
  .cb{max-width:82%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;animation:cbin .25s ease}
  @keyframes cbin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .cb.ki{align-self:flex-end;background:#0e7a3c;color:#fff;border-bottom-right-radius:4px}
  .cb.anr{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
  .cb .lbl{font-size:11px;font-weight:700;opacity:.6;margin-bottom:2px}
  .sigwrap{border:1px solid var(--line);border-radius:10px;background:#fff}
  .sigwrap canvas{width:100%;height:150px;display:block;touch-action:none;border-radius:10px}
  .hamb{display:none}
  @media(max-width:920px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);transition:.2s;width:250px}
    .side.show{transform:none;box-shadow:0 0 60px rgba(0,0,0,.2)}
    .hamb{display:inline-grid}
    .g4{grid-template-columns:1fr 1fr}
    .g3{grid-template-columns:1fr}
    .g2{grid-template-columns:1fr}
    .content{padding:18px 16px 60px}
    .top{padding:10px 14px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="dot">R</span> Reparado</div>

const STATUS = {
  offen:{lbl:'Offen', cls:''},
  bearbeitung:{lbl:'In Bearbeitung', cls:'solid'},
  warten:{lbl:'Warte auf Ersatzteil', cls:'dash'},

  abgeholt:{lbl:'Abgeschlossen', cls:'soft'},
};
const STFLOW=['offen','bearbeitung','warten','fertig','abgeholt'];
function statusPill(s){const m=STATUS[s]||STATUS.offen;return `<span class="pill ${m.cls}"><span class="d"></span>${m.lbl}</span>`;}
function cust(id){return S.cust.find(c=>c.id===id)||{name:'—',tel:'',mail:'',adr:''};}
function eur(n){return '€ '+Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function initials(n){return (n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function today(){return new Date().toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
function addMonths(ds,m){const x=new Date(ds);x.setMonth(x.getMonth()+(+m||0));return x.toISOString().slice(0,10);}
function fmtDate(d){if(!d)return '—';const x=new Date(d);return x.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});}
function isThisMonth(ds){if(!ds)return false;const x=new Date(ds);const n=new Date();return x.getFullYear()===n.getFullYear()&&x.getMonth()===n.getMonth();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2200);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const views={};
let current='dashboard';
function go(v){ current=v;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===v));
  document.getElementById('side').classList.remove('show');
  window.scrollTo(0,0);
  (views[v]||views.dashboard)();
  paintIcons(); refreshBadges();
}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a){go(a.dataset.view);}});
function refreshBadges(){
  document.getElementById('bg-auf').textContent=S.ord.filter(o=>o.status!=='abgeholt').length;

}

function signOrder(id){
  openModal(`<div class="dhead"><b style="flex:1">Unterschrift bei Annahme</b><button class="btn sm gho" onclick="closeAll()">Schließen</button></div>
   <div class="dbody">
     <div class="note" style="margin-bottom:12px">Der Kunde bestätigt mit seiner Unterschrift die Auftragserteilung sowie die Kenntnisnahme des Hinweises zur Datensicherung. Für Datenverlust wird keine Haftung übernommen.</div>
     <div class="sigwrap"><canvas id="sig" width="520" height="150"></canvas></div>
     <div class="row" style="margin-top:12px;justify-content:space-between">
       <button class="btn gho" onclick="clearSig()">Löschen</button>
       <button class="btn pri" onclick="saveSig('${id}')">Übernehmen</button>
     </div>
   </div>`);
  setTimeout(initSig,30);
}
function initSig(){
  const c=document.getElementById('sig'); if(!c)return; const ctx=c.getContext('2d');
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0e7a3c';
  let drawing=false,last=null; window.__sigDirty=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
  const start=e=>{drawing=true;last=pos(e);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;window.__sigDirty=true;e.preventDefault();};
  const end=()=>{drawing=false;};
  c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);
}
function clearSig(){const c=document.getElementById('sig');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);window.__sigDirty=false;}}
function saveSig(id){const c=document.getElementById('sig');const o=S.ord.find(x=>x.id===id);
  if(!window.__sigDirty){toast('Bitte zuerst unterschreiben');return;}
  o.sig=c.toDataURL('image/png');save();closeAll();toast('Unterschrift gespeichert');openOrder(id);}

/* ============================ KALENDER ============================ */
views.kalender=function(){
  const m=document.getElementById('main');
  const base=new Date(); base.setDate(1);
  const y=base.getFullYear(),mo=base.getMonth();
  const first=(new Date(y,mo,1).getDay()+6)%7; const dim=new Date(y,mo+1,0).getDate();
  const evByDay={};
  S.ord.forEach(o=>{ if(o.appt){(evByDay[o.appt]=evByDay[o.appt]||[]).push({t:'Termin',o});}
    if(o.due&&o.status!=='abgeholt'){(evByDay[o.due]=evByDay[o.due]||[]).push({t:'Fällig',o});}});
  let cells='';
  for(let i=0;i<first;i++)cells+='<div></div>';
  for(let dnum=1;dnum<=dim;dnum++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(dnum).padStart(2,'0')}`;
    const ev=evByDay[ds]||[]; const isToday=ds===today();
    cells+=`<div style="border:1px solid var(--line);border-radius:10px;padding:8px;min-height:92px;${isToday?'outline:2px solid #0e7a3c;outline-offset:-2px':''}">
      <div style="font-weight:700;font-size:13px;${isToday?'':'color:#888'}">${dnum}</div>
      ${ev.slice(0,3).map(e=>`<div onclick="openOrder('${e.o.id}')" style="cursor:pointer;font-size:11px;margin-top:3px;padding:2px 5px;border-radius:5px;${e.t==='Termin'?'background:#0e7a3c;color:#fff':'background:var(--soft);color:#0e7a3c'}">${esc(cust(e.o.cid).name.split(' ')[0])}</div>`).join('')}
      ${ev.length>3?`<div class="muted" style="font-size:11px;margin-top:2px">+${ev.length-3} mehr</div>`:''}
    </div>`;
  }
  const monName=base.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  m.innerHTML=`<div class="between"><div><h1 class="h1">Kalender</h1><p class="sub">${monName}</p></div>
     <div class="row"><span class="pill solid"><span class="d"></span>Termin</span><span class="pill soft"><span class="d"></span>Fällig</span></div></div>
   <div class="card" style="margin-top:16px">
     <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="muted" style="font-size:12px;font-weight:700;text-align:center">${d}</div>`).join('')}</div>
     <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:6px">${cells}</div>
   </div>`;
};

function renderTemplate(r,o){

  const stats={n_termine:S.ord.filter(x=>x.appt===today()).length,n_fertig:S.ord.filter(x=>x.status==='fertig').length,
    n_warten:S.ord.filter(x=>x.status==='warten').length,n_ueberfaellig:S.ord.filter(x=>x.due<today()&&x.status!=='abgeholt').length};
  const map={
    '{kunde}':c.name||'Kunde','{werkstatt}':SHOP.name,'{stadt}':SHOP.city,'{telefon}':SHOP.phone,
    '{adresse}':SHOP.street+', '+SHOP.zip+' '+SHOP.city,'{oeffnung}':SHOP.hours,
    '{google}':SHOP.google,'{geraet}':o?(o.brand+' '+o.model):'Ihr Gerät','{leistung}':o?o.issue:'',
    '{auftrag}':o?o.nr:'','{preis}':o?eur(o.price):'','{termin}':o&&o.appt?fmtDate(o.appt):'nach Absprache',
    '{tracking}':o?('reparado.de/status/'+o.nr):'','{teil}':o?o.issue:'','{lieferant}':'Foneday','{eta}':'',
    '{telefon_kunde}':c.tel||'','{stock}':'','{min}':'',
    '{n_termine}':stats.n_termine,'{n_fertig}':stats.n_fertig,'{n_warten}':stats.n_warten,'{n_ueberfaellig}':stats.n_ueberfaellig,
  };
  const rep=s=>Object.keys(map).reduce((a,k)=>a.split(k).join(map[k]),s||'');
  return {subj:rep(r.subj),body:rep(r.body),to:r.who==='kunde'?(c.mail||c.name):(SHOP.email)};
}

function computeQueue(){
  const q=[]; const on=id=>{const r=S.rules.find(x=>x.id===id);return r&&r.on?r:null;};
  const push=(r,who,ch,toName,title,sub,when,o)=>q.push({who,ch,toName,title,sub,when,o,ruleId:r.id});
  S.ord.forEach(o=>{
    const c=cust(o.cid); let r;
    if(o.appt){ const dd=daysBetween(today(),o.appt);
      if(dd===1&&(r=on('r_appt24'))) push(r,'kunde',r.ch,c.name,'Terminerinnerung',o.model+' · morgen',fmtDate(o.appt),o);
      if(dd===0&&(r=on('r_dropoff'))) push(r,'kunde',r.ch,c.name,'Abgabe-Checkliste',o.model+' · heute',fmtDate(o.appt),o);
    }
    if(o.status==='fertig'&&o.readyAt){ const age=daysBetween(o.readyAt,today());
      if(age>=3&&age<14&&(r=on('r_pickup3'))) push(r,'kunde',r.ch,c.name,'Abhol-Erinnerung',o.model+' · seit '+age+' Tagen fertig','in Kürze',o);
      if(age>=14&&(r=on('r_pickup14'))) push(r,'kunde',r.ch,c.name,'Letzte Abhol-Erinnerung',o.model+' · seit '+age+' Tagen','fällig',o);
      if(age>=7&&(r=on('w_uncoll'))) push(r,'werkstatt',r.ch,'Werkstatt','Gerät nicht abgeholt',c.name+' · '+o.model+' · '+age+' Tage','nachfassen',o);
    }
    if(o.status==='abgeholt'&&o.pickedAt){ const age=daysBetween(o.pickedAt,today());
      if(age>=1&&age<3&&(r=on('r_review'))) push(r,'kunde',r.ch,c.name,'Bewertungsanfrage',o.model,'morgen',o);}
    if(o.status!=='abgeholt'&&o.due<today()&&(r=on('w_overdue'))) push(r,'werkstatt',r.ch,'Werkstatt','Auftrag überfällig',o.nr+' · '+c.name,'jetzt',o);
  });
  S.orders.forEach(b=>{ let r;
    if(b.status!=='geliefert'&&b.eta<today()&&(r=on('w_order_late'))) push(r,'werkstatt',r.ch,'Werkstatt','Bestellung überfällig',b.part+' · '+b.supplier,'jetzt',null);
  });
  S.parts.forEach(p=>{ let r; if(p.stock<p.min&&(r=on('w_lowstock'))) push(r,'werkstatt',r.ch,'Werkstatt','Lager niedrig',p.name+' · '+p.stock+'/'+p.min,'nachbestellen',null);});
  const rd=on('w_daily'); if(rd) push(rd,'werkstatt',rd.ch,'Werkstatt','Tagesüberblick','Termine, Abholungen und offene Punkte','morgen 08:00',null);
  const order={'jetzt':0,'fällig':0,'in Kürze':1,'morgen':2,'nachfassen':3,'nachbestellen':3,'morgen 08:00':9};
  return q.sort((a,b)=>(order[a.when]??5)-(order[b.when]??5));
}
function previewQueue(i){const r=computeQueue()[i];const rule=S.rules.find(x=>x.id===r.ruleId);showMail(rule,r.o);}
function fireQueue(i){const r=computeQueue()[i];const rule=S.rules.find(x=>x.id===r.ruleId);logMail(r.o||{cid:''},rule,'manuell aus Liste');toast(r.ch+' an '+r.toName+' gesendet');views.erinnerungen();paintIcons();}

let cart=[], kasseTab='pos', payMethod='bar', givenAmt=0;
const POS_ITEMS=[['Displayschutz',15],['Panzerglas',25],['Hülle',12],['Ladekabel',9],['Netzteil',19],['Powerbank',29],['Kopfhörer',19],['Reinigung',10],['SIM-Karte',10]];

/* --- TSE (KassenSichV, simuliert aber vollständig) --- */
function ensureTse(){
  if(!S.tse){ S.tse={active:true,provider:'fiskaly Cloud-TSE',serial:'DE-TSE-8F3A-22Q7',sigCounter:41287,txCounter:10480,capacity:20000000,certUntil:'2029-12-31',seeded:false}; save(); }
  if(!S.tse.seeded) seedKasse();
  return S.tse;
}
function fakeSig(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}const ch='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';let out='';let x=h;for(let i=0;i<44;i++){x=(x*1103515245+12345)>>>0;out+=ch[(x>>>8)%64];}return out;}
function fakeQR(str){const size=21;let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*16777619)>>>0;}const nx=()=>{h=(h*1103515245+12345)>>>0;return (h>>>10)&1;};
  const fp=(r,c)=>((r===0||r===6||c===0||c===6)||(r>=2&&r<=4&&c>=2&&c<=4));
  const zone=(r,c)=>{if(r<7&&c<7)return fp(r,c);if(r<7&&c>=size-7)return fp(r,c-(size-7));if(r>=size-7&&c<7)return fp(r-(size-7),c);return null;};
  let s='<div style="display:grid;grid-template-columns:repeat('+size+',3px);grid-auto-rows:3px;width:'+size*3+'px;height:'+size*3+'px;-webkit-print-color-adjust:exact;print-color-adjust:exact">';
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){const z=zone(r,c);const on=z===null?(nx()===1):z;s+='<span style="background:'+(on?'#0f2318':'#fff')+'"></span>';}
  return s+'</div>';}
function seedKasse(){const t=S.tse;const now=new Date();
  const picks=[[['Panzerglas',25],['Reinigung',10]],[['Hülle',12]],[['Netzteil',19],['Ladekabel',9]],[['Powerbank',29]],[['Displayschutz',15],['Hülle',12]],[['Kopfhörer',19]]];
  picks.forEach((p,i)=>{const positions=p.map(x=>({name:x[0],qty:1,price:x[1],vat:19}));const brutto=positions.reduce((s,x)=>s+x.price,0);const net=brutto/1.19;const time=new Date(now);time.setHours(9+i,8+i*9,0,0);t.txCounter++;t.sigCounter++;const method=(i%3===2)?'karte':'bar';const given=method==='bar'?Math.ceil(brutto/10)*10:brutto;
    S.sales.unshift({t:time.toISOString(),beleg:'BON-'+time.getFullYear()+'-'+String(t.txCounter).padStart(4,'0'),positions,net,vat:brutto-net,brutto,total:brutto,method,given,change:given-brutto,tse:{serial:t.serial,txNum:t.txCounter,sigCounter:t.sigCounter,start:time.toISOString(),finish:new Date(time.getTime()+52).toISOString(),sig:fakeSig(brutto+'|'+t.txCounter),processType:'Kassenbeleg-V1',algo:'ecdsa-plain-SHA256'},storno:false});});
  t.seeded=true;save();}

views.kasse=function(){
  const m=document.getElementById('main'); const t=ensureTse(); const remaining=t.capacity-t.sigCounter;
  m.innerHTML=`<div class="between"><div><h1 class="h1">Kasse</h1><p class="sub">TSE-gesicherte Kasse nach KassenSichV (§146a AO)${S.cash.connected?(' · Terminal '+S.cash.connected):''}</p></div>
     <div class="row"><span class="pill ${t.active?'solid':'soft'}"><span class="d"></span>${t.active?'TSE aktiv':'TSE inaktiv'}</span><button class="btn" onclick="tagesabschluss()">Tagesabschluss (Z-Bon)</button></div></div>
   <div class="seg" style="margin:16px 0"><button class="${kasseTab==='pos'?'on':''}" onclick="kasseTab='pos';views.kasse();paintIcons()">Kasse</button><button class="${kasseTab==='journal'?'on':''}" onclick="kasseTab='journal';views.kasse();paintIcons()">Kassenbuch</button></div>

    body.innerHTML=`<div class="grid g2" style="grid-template-columns:1.4fr 1fr">

        <div class="search" style="background:var(--soft)"><span class="ic" data-ic="search"></span><input placeholder="Artikel suchen …" oninput="posSearch(this.value)"></div>

        </div>

        <div class="note" style="margin-top:14px">TSE: ${t.provider} · Serien-Nr ${t.serial} · Zertifikat gültig bis ${fmtDate(t.certUntil)} · ~${remaining.toLocaleString('de-DE')} Signaturen frei</div>
      </div>
      <div class="card"><b>Warenkorb</b><div id="cartlist" style="margin-top:8px">${renderCart()}</div></div>
    </div>`;
  } else { body.innerHTML=journalHTML(); }
};
function cartTotals(){let brutto=0;const byRate={};cart.forEach(i=>{const line=i.price*i.qty;const r=i.vat||19;brutto+=line;const net=line/(1+r/100);byRate[r]=byRate[r]||{net:0,vat:0};byRate[r].net+=net;byRate[r].vat+=(line-net);});const net=Object.values(byRate).reduce((s,x)=>s+x.net,0);return{brutto,net,vat:brutto-net,byRate};}
function renderCart(){
  if(!cart.length) return '<div class="empty">Warenkorb leer</div>';
  const t=cartTotals();
  const rows=cart.map((i,x)=>`<div class="listitem"><div style="flex:1;min-width:0"><b>${esc(i.name)}</b><div class="muted" style="font-size:12px">${eur(i.price)} · ${i.vat||19}% USt</div></div>
    <div class="row" style="gap:5px"><button class="btn sm gho" onclick="cartQty(${x},-1)">–</button><b style="min-width:16px;text-align:center">${i.qty}</b><button class="btn sm gho" onclick="cartQty(${x},1)">+</button></div>
    <div class="mono" style="min-width:60px;text-align:right">${eur(i.price*i.qty)}</div>
    <button class="btn sm gho" onclick="cart.splice(${x},1);refreshCart()">✕</button></div>`).join('');
  const change=payMethod==='bar'?(givenAmt-t.brutto):0;
  const quick=[t.brutto,Math.ceil(t.brutto/5)*5,Math.ceil(t.brutto/10)*10,Math.ceil(t.brutto/50)*50].filter((v,i,a)=>a.indexOf(v)===i);
  return rows+`
    <div class="divider"></div>
    <div class="between" style="font-size:13px;color:var(--ink2)"><span>Netto</span><span class="mono">${eur(t.net)}</span></div>
    <div class="between" style="font-size:13px;color:var(--ink2);margin-top:2px"><span>USt 19 %</span><span class="mono">${eur(t.vat)}</span></div>
    <div class="between" style="margin-top:7px"><b>Summe</b><b style="font-size:22px">${eur(t.brutto)}</b></div>
    <label class="f" style="margin-top:14px">Zahlung</label>
    <div class="seg" style="width:100%"><button class="${payMethod==='bar'?'on':''}" style="flex:1" onclick="payMethod='bar';refreshCart()">Bar</button><button class="${payMethod==='karte'?'on':''}" style="flex:1" onclick="payMethod='karte';refreshCart()">Karte</button></div>
    ${payMethod==='bar'?`<div class="row" style="margin-top:10px;align-items:flex-end">
       <div style="flex:1"><label class="f">Gegeben (€)</label><input class="in" type="number" value="${givenAmt||''}" oninput="givenAmt=+this.value||0;var r=document.getElementById('rueck');if(r)r.textContent=eur(Math.max(0,givenAmt-${t.brutto}))" placeholder="${t.brutto.toFixed(2)}"></div>
       <div style="text-align:right;min-width:90px"><label class="f">Rückgeld</label><div id="rueck" style="font-size:20px;font-weight:800">${eur(Math.max(0,change))}</div></div>
     </div>
     <div class="row" style="margin-top:8px">${quick.map(v=>`<button class="chip" onclick="givenAmt=${v};refreshCart()">${eur(v)}</button>`).join('')}</div>`:''}
    <button class="btn pri" style="width:100%;margin-top:14px;justify-content:center" onclick="checkout()">Kassieren · ${eur(t.brutto)}</button>`;
}
function refreshCart(){const el=document.getElementById('cartlist');if(el)el.innerHTML=renderCart();}
function cartQty(x,d){cart[x].qty=Math.max(1,cart[x].qty+d);refreshCart();}
function posAdd(name,price){cart.push({name,price:+price,qty:1,vat:19});refreshCart();}
function reparaturPos(){const p=+prompt('Reparatur-Betrag (€, brutto):')||0;if(!p)return;cart.push({name:'Reparatur',price:p,qty:1,vat:19});refreshCart();}
function freePos(){const n=prompt('Bezeichnung der Position:');if(!n)return;const p=+prompt('Preis (€, brutto):')||0;cart.push({name:n,price:p,qty:1,vat:19});refreshCart();}
function posSearch(v){window.__posq=v;}
function addToCart(orderId){const o=S.ord.find(x=>x.id===orderId);if(o){cart.push({name:o.nr+' · '+o.model+' · '+o.issue,price:o.price,qty:1,vat:19});toast('Auftrag in Kasse übernommen');kasseTab='pos';views.kasse();paintIcons();}}
function checkout(){
  if(!cart.length){toast('Warenkorb leer');return;}
  const tot=cartTotals();
  if(payMethod==='bar'&&givenAmt<tot.brutto-0.001){toast('Gegebener Betrag zu niedrig');return;}
  const t=ensureTse();t.txCounter++;t.sigCounter++;const start=new Date();
  const tx={t:start.toISOString(),beleg:'BON-'+start.getFullYear()+'-'+String(t.txCounter).padStart(4,'0'),
    positions:cart.map(i=>({name:i.name,qty:i.qty,price:i.price,vat:i.vat||19})),net:tot.net,vat:tot.vat,brutto:tot.brutto,total:tot.brutto,
    method:payMethod,given:payMethod==='bar'?givenAmt:tot.brutto,change:payMethod==='bar'?(givenAmt-tot.brutto):0,
    tse:{serial:t.serial,txNum:t.txCounter,sigCounter:t.sigCounter,start:start.toISOString(),finish:new Date(start.getTime()+48).toISOString(),sig:fakeSig(tot.brutto+'|'+t.txCounter+'|'+start.toISOString()),processType:'Kassenbeleg-V1',algo:'ecdsa-plain-SHA256'},storno:false};
  S.sales.unshift(tx);save();cart=[];givenAmt=0;
  printBon(tx);toast('Verkauf abgeschlossen · TSE signiert');views.kasse();paintIcons();
}
function printBon(tx){if(tx)printHTML('Beleg '+tx.beleg,bonHTML(tx));}
function bonHTML(tx){
  const rows=tx.positions.map(p=>`<tr><td>${esc(p.name)}${p.qty>1?' ×'+p.qty:''}<div style="color:#777;font-size:11px">${p.vat}% USt</div></td><td style="text-align:right;font-variant-numeric:tabular-nums">${eur(p.price*p.qty)}</td></tr>`).join('');
  const qrData='V0;'+tx.tse.serial+';Kassenbeleg-V1;'+tx.beleg+';'+tx.brutto.toFixed(2)+';'+tx.tse.txNum+';'+tx.tse.sig;
  const st=tx.storno?'<div style="text-align:center;font-weight:800;border:2px solid #0f2318;border-radius:8px;padding:6px;margin-bottom:10px">STORNO'+(tx.stornoOf?' zu '+tx.stornoOf:'')+'</div>':'';
  return shopHead()+st+`<h2>Kassenbeleg</h2><div class="muted">${tx.beleg} · ${new Date(tx.t).toLocaleString('de-DE')}</div>
   <table><tbody>${rows}</tbody></table>
   <table><tbody><tr><th>Netto</th><td style="text-align:right">${eur(tx.net)}</td></tr><tr><th>USt 19 %</th><td style="text-align:right">${eur(tx.vat)}</td></tr></tbody></table>
   <div class="tot"><span>Summe (Brutto)</span><span>${eur(tx.brutto)}</span></div>
   <table style="margin-top:6px"><tbody><tr><th>Zahlart</th><td style="text-align:right">${tx.method==='bar'?'Bar':'Karte'}</td></tr>${tx.method==='bar'?`<tr><th>Gegeben</th><td style="text-align:right">${eur(tx.given)}</td></tr><tr><th>Rückgeld</th><td style="text-align:right">${eur(tx.change)}</td></tr>`:''}</tbody></table>
   <div class="box" style="margin-top:14px;font-size:11px"><b>TSE-Signatur (KassenSichV)</b>
     <div style="display:flex;gap:12px;margin-top:8px;align-items:flex-start">${fakeQR(qrData)}
       <div style="font-size:10px;line-height:1.55;word-break:break-all;font-variant-numeric:tabular-nums">TSE-Serien-Nr: ${tx.tse.serial}<br>Transaktion: ${tx.tse.txNum}<br>Signaturzähler: ${tx.tse.sigCounter}<br>Start: ${new Date(tx.tse.start).toLocaleTimeString('de-DE')}<br>Finish: ${new Date(tx.tse.finish).toLocaleTimeString('de-DE')}<br>Algorithmus: ${tx.tse.algo}<br>Signatur: ${tx.tse.sig}</div>
     </div></div>
   <div class="foot">Belegausgabepflicht gemäß §146a AO · Preise inkl. gesetzl. USt · Vielen Dank für Ihren Einkauf bei ${SHOP.name}.</div>`;
}
function journalHTML(){
  const today=new Date().toISOString().slice(0,10);
  const tx=S.sales.filter(x=>x.beleg);
  const todayTx=tx.filter(x=>x.t.slice(0,10)===today);
  const sum=(a)=>a.reduce((s,x)=>s+x.brutto,0);
  const bar=sum(todayTx.filter(x=>x.method==='bar'&&!x.storno)), karte=sum(todayTx.filter(x=>x.method==='karte'&&!x.storno));
  return `<div class="grid g4">
     <div class="card kpi"><div class="n">${eur(bar+karte)}</div><div class="l">Umsatz heute (Brutto)</div></div>
     <div class="card kpi"><div class="n">${eur(bar)}</div><div class="l">Bar</div></div>
     <div class="card kpi"><div class="n">${eur(karte)}</div><div class="l">Karte</div></div>
     <div class="card kpi"><div class="n">${todayTx.length}</div><div class="l">Transaktionen heute</div></div>
   </div>
   <div class="card" style="margin-top:16px;padding:0;overflow:auto"><table>
     <thead><tr><th>Zeit</th><th>Beleg</th><th>Positionen</th><th>Brutto</th><th>Zahlart</th><th>TSE-Tx</th><th></th></tr></thead>
     <tbody>${tx.slice(0,40).map(x=>`<tr>
       <td class="mono muted">${new Date(x.t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</td>
       <td><b>${x.beleg}</b>${x.storno?' <span class="tag">Storno</span>':''}</td>
       <td>${esc(x.positions.map(p=>p.name+(p.qty>1?' ×'+p.qty:'')).join(', ')).slice(0,44)}</td>
       <td class="mono">${eur(x.brutto)}</td>
       <td>${x.method==='bar'?'Bar':'Karte'}</td>
       <td class="mono muted">#${x.tse.txNum}</td>
       <td><div class="row" style="gap:4px"><button class="btn sm gho" onclick="printBon(S.sales.find(s=>s.beleg==='${x.beleg}'))">Bon</button>${x.storno?'':`<button class="btn sm gho" onclick="stornoTx('${x.beleg}')">Storno</button>`}</div></td>
     </tr>`).join('')||'<tr><td colspan="7"><div class="empty">Noch keine TSE-Transaktionen</div></td></tr>'}</tbody></table></div>
   <div class="note" style="margin-top:14px">Jede Transaktion wird von der TSE signiert (Signatur, Transaktions- &amp; Signaturzähler, Zeitstempel) und ist unveränderbar im Journal protokolliert — konform zu KassenSichV/GoBD.</div>`;

function stornoTx(beleg){
  const orig=S.sales.find(x=>x.beleg===beleg); if(!orig||orig.storno)return;
  const t=ensureTse();t.txCounter++;t.sigCounter++;const start=new Date();
  const tx={t:start.toISOString(),beleg:'BON-'+start.getFullYear()+'-'+String(t.txCounter).padStart(4,'0'),positions:orig.positions.map(p=>({name:p.name,qty:p.qty,price:-p.price,vat:p.vat})),net:-orig.net,vat:-orig.vat,brutto:-orig.brutto,total:-orig.brutto,method:orig.method,given:0,change:0,tse:{serial:t.serial,txNum:t.txCounter,sigCounter:t.sigCounter,start:start.toISOString(),finish:new Date(start.getTime()+50).toISOString(),sig:fakeSig('storno|'+t.txCounter),processType:'Kassenbeleg-V1',algo:'ecdsa-plain-SHA256'},storno:true,stornoOf:beleg};
  orig.storno=true;orig.stornoBy=tx.beleg;S.sales.unshift(tx);save();
  toast('Storno TSE-signiert: '+tx.beleg);views.kasse();paintIcons();
}
function tagesabschluss(){
  const today=new Date().toISOString().slice(0,10);const t=ensureTse();
  const tx=S.sales.filter(x=>x.beleg&&x.t.slice(0,10)===today);const valid=tx.filter(x=>!x.storno);
  const bar=valid.filter(x=>x.method==='bar').reduce((s,x)=>s+x.brutto,0);
  const karte=valid.filter(x=>x.method==='karte').reduce((s,x)=>s+x.brutto,0);
  const net=valid.reduce((s,x)=>s+x.net,0),ust=valid.reduce((s,x)=>s+x.vat,0);
  const body=shopHead()+`<h2>Tagesabschluss (Z-Bon)</h2><div class="muted">Kassenschnitt · ${fmtDate(today)}</div>
   <table><tbody>
     <tr><th>Transaktionen</th><td style="text-align:right">${tx.length}${tx.length-valid.length?' · '+(tx.length-valid.length)+' Storno':''}</td></tr>
     <tr><th>Bar</th><td style="text-align:right">${eur(bar)}</td></tr>
     <tr><th>Karte</th><td style="text-align:right">${eur(karte)}</td></tr>
     <tr><th>Netto</th><td style="text-align:right">${eur(net)}</td></tr>
     <tr><th>USt 19 %</th><td style="text-align:right">${eur(ust)}</td></tr>
   </tbody></table>
   <div class="tot"><span>Tagesumsatz (Brutto)</span><span>${eur(bar+karte)}</span></div>
   <div class="box" style="margin-top:12px;font-size:12px"><b>TSE</b><br>Serien-Nr: ${t.serial}<br>Signaturzähler: ${t.sigCounter}<br>Transaktionszähler: ${t.txCounter}<br>Anbieter: ${t.provider}</div>
   <div class="foot">Z-Bon gemäß GoBD · unveränderbar protokolliert.</div>`;
  printHTML('Tagesabschluss '+fmtDate(today),body);
}

function pullBookings(){
  let arr=[]; try{arr=JSON.parse(localStorage.getItem('reparado_bookings')||'[]');}catch(e){}
  if(!arr.length) return 0;
  let n=0;
  arr.forEach(bk=>{
    let c=S.cust.find(x=>x.tel===bk.tel||(bk.mail&&x.mail===bk.mail));
    if(!c){c={id:uid('c'),name:bk.name,tel:bk.tel,mail:bk.mail||'',adr:bk.adr||''};S.cust.push(c);}
    const nr='REP-'+(S.counter++);
    const o={id:uid('o'),nr,cid:c.id,brand:bk.brand,model:bk.model,issue:bk.issue,qual:'Original',price:+bk.price||0,
      status:'offen',prio:'Standard',created:today(),due:bk.appt||today(),appt:bk.appt||'',notes:'Online gebucht',imei:'',
      readyAt:'',warranty:SHOP.warranty,sig:'',source:'online'};
    S.ord.unshift(o);
    const r=S.rules.find(x=>x.id==='r_confirm'); if(r&&r.on) logMail(o,r,'automatisch (Online-Buchung)');
    n++;
  });
  localStorage.removeItem('reparado_bookings'); save();
  return n;
}

function diagnoseEngine(txt){
  const t=txt.toLowerCase();
  const voltM=t.match(/(\d{1,3})\s*(v\b|volt)/); const volt=voltM?+voltM[1]:null;
  const errM=t.match(/fehler\s*(\d{1,3})|error\s*(\d{1,3})|\bcode\s*(\d{1,3})/); const errorCode=errM?(errM[1]||errM[2]||errM[3]):null;
  const water=/regen|wasser|nass|feucht|flüssig|water|reingefallen|klo|toilette/.test(t);
  const fell=/sturz|gefallen|runtergefallen|drop|gestürzt|aufgeschlagen/.test(t);
  const swollen=/aufgebläht|geschwollen|gewölbt|swollen|bläht/.test(t);
  const heat=/heiß|heiss|überhitz|ueberhitz|wird warm|zu warm|hot/.test(t);
  const scooterHint=/scooter|roller|e-?scooter|ninebot|segway|g30|m365|pro 2|1s\b|essential|mi 3|max g/.test(t);
  const ebikeHint=/e-?bike|pedelec|bosch|shimano|fahrrad/.test(t);
  const type = scooterHint||(volt&&volt>=20)?'scooter':(ebikeHint?'ebike':'phone');
  // Marke/Modell best-effort
  let brand='', model='';
  const bm=[['apple','Apple'],['iphone','Apple'],['ipad','Apple'],['samsung','Samsung'],['galaxy','Samsung'],['xiaomi','Xiaomi'],['redmi','Xiaomi'],['huawei','Huawei'],['ninebot','Ninebot'],['segway','Segway']];
  bm.forEach(x=>{if(!brand&&t.includes(x[0]))brand=x[1];});
  const modM=t.match(/\b(iphone|galaxy|redmi note|redmi|ipad|mi|pro|max|g30|note|s\d{2}|a\d{2})\s?[\w.+ ]{0,12}/i); if(modM){model=modM[0].replace(/\s+/g,' ').trim(); model=model.split(/\b(fehler|error|code|nach|akku|volt|display|lädt|startet|flackert|hält|geht|kein)\b/i)[0].replace(/[,;].*$/,'').replace(/\s+[a-zäöü]$/i,'').trim();}
  // Symptome
  const S={water,fell,swollen,heat,
    noStart:/startet? nicht|geht nicht an|kein strom|\btot\b|bootet nicht|kein bild|fährt nicht/.test(t),
    noCharge:/lädt nicht|laden|ladeanschluss|ladebuchse|charge|kein laden/.test(t),
    battery:/akku|batterie|hält nicht|schnell leer|läuft leer|volt|kapazität/.test(t)||volt!=null,
    display:/display|bildschirm|flackert|touch|streifen|schwarz|glas gebrochen|riss/.test(t),
    motor:/motor|ruckelt|zieht nicht|dreht nicht|kein antrieb/.test(t),
    brake:/bremse|brems|brake/.test(t),
    audio:/lautsprecher|mikrofon|ton|leise/.test(t),
    camera:/kamera|foto/.test(t)};
  const causes=[];
  const add=(label,w,why,tests,parts,tools)=>causes.push({label,w,why,tests:tests||[],parts:parts||[],tools:tools||[]});
  if(type==='scooter'||type==='ebike'){
    if(water) add('Feuchtigkeitsschaden / Korrosion an Steckverbindern',45,'„nach Regen" + Elektronik: Wasser dringt an Steckverbinder & Controller, Korrosion stört Signale.',['Sichtprüfung auf Feuchtigkeit/Korrosion','Steckverbinder trennen, trocknen, mit Isopropanol reinigen','erneut Fehlercode auslesen'],['Steckverbinder-Set','Dichtungen'],['Torx/Inbus-Set','Isopropanol','Heißluft/Föhn','Multimeter']);
    if(errorCode) add('Kommunikationsfehler Controller ↔ Dashboard/BMS (Fehler '+errorCode+')',water?30:42,'Fehlercode '+errorCode+' deutet typ. auf gestörte Kommunikation zwischen Steuerung und Display/BMS.',['Fehlercode via Diagnose-App/Kabel auslesen','Kabelbaum & Stecker prüfen','Firmware/Reset','Controller tauschen wenn keine Kommunikation'],['Controller','Kabelbaum'],['Diagnose-App/Kabel','Multimeter']);
    if(S.battery||volt) add('Akku-Unterspannung / schwache Zelle'+(volt?(' ('+volt+' V gemessen)'):''),volt&&volt<38?28:18,(volt?('Gemessene '+volt+' V liegen unter dem gesunden Bereich (~42 V voll bei 36-V-Systemen) → Zelle/BMS prüfen.'):'Reichweiten-/Startprobleme deuten auf Akku/BMS.'),['Gesamt- und Zellspannungen am BMS messen','Zellabweichung prüfen','Ladevorgang beobachten'],['Akkupack','BMS'],['Multimeter','Zellspannungsprüfer']);
    if(S.motor) add('Hall-Sensor / Motorkabel',22,'Ruckeln/kein Antrieb deutet auf Hall-Sensor oder Motorphasenkabel.',['Motorstecker & Hall-Signale prüfen','Motorkabel auf Bruch prüfen','Motor testweise tauschen'],['Motorrad/Motor','Hall-Sensor'],['Multimeter','Torx-Set']);
    if(S.brake) add('Bremssensor',12,'Bremssignal kann Motorfreigabe blockieren.',['Bremshebel-Sensor & Stecker prüfen'],['Bremssensor'],['Torx-Set']);
    if(!causes.length) add('Elektronik / Verkabelung allgemein',40,'Zu wenig Anhaltspunkte – zuerst Sichtprüfung und Fehlercode auslesen.',['Sichtprüfung','Fehlercode auslesen','Spannungen messen'],[],['Multimeter','Diagnose-Kabel']);
  } else {

    if(S.noCharge) add('Ladekabel / Netzteil',18,'Häufige, billige Ursache – vor Öffnen ausschließen.',['Original-Netzteil & neues Kabel testen'],['—'],['—']);
    if(S.display) add('Display / Displayflex'+(fell?' (nach Sturz)':''),fell?68:55,(fell?'Sturz + Flackern/Streifen deutet stark auf beschädigtes Display oder gelösten Displaystecker.':'Flackern/Streifen deutet auf Display oder Flexkabel.'),['Displaystecker neu einstecken','Ersatzdisplay testweise anstecken','Display tauschen'],['Displayeinheit'],['Pentalobe/Torx','Saugnapf','Plektren','Heißluft']);
    if(S.battery) add('Akku verschlissen'+(volt?'':''),heat?35:60,(heat?'„hält nicht" + Erwärmung: Akku am Lebensende, evtl. Lade-IC.':'Kurze Laufzeit deutet auf verschlissenen Akku (Zyklen/Health).'),['Akku-Health/Zyklen auslesen','Ruhestrom messen','Akku tauschen'],['Akku'],['Spudger','Klebestreifen','Heißluft']);
    if(S.heat) add('Lade-IC / Board (Kurzschluss)',water?30:15,'Erwärmung ohne Last kann auf Kurzschluss am Lade-IC/Board hindeuten.',['Wärmebild/Strommessung im Kurzschlussfall','Board-Diagnose'],['Lade-IC','Board-Reparatur'],['Labornetzteil','Mikroskop','Heißluft']);
    if(water) add('Flüssigkeitsschaden / Korrosion',water?45:0,'Wasserkontakt: Korrosion auf dem Board, Folgeschäden möglich.',['Öffnen, Board auf Korrosion prüfen','Ultraschallreinigung','betroffene Bauteile prüfen'],['—'],['Ultraschallbad','Mikroskop','Isopropanol']);
    if(S.audio) add('Lautsprecher / Hörmuschel',30,'Tonproblem: Lautsprechermodul oder Verschmutzung.',['Lautsprecher testen & reinigen','Modul tauschen'],['Lautsprechermodul'],['Spudger']);
    if(!causes.length) add('Allgemeine Fehlersuche',40,'Zu wenig Anhaltspunkte – strukturierte Sichtprüfung starten.',['Sichtprüfung','Funktionstest','Diagnose-Tool'],[],['Spudger','Multimeter']);
  }
  // normalisieren
  const total=causes.reduce((s,c)=>s+c.w,0)||1;
  causes.forEach(c=>c.p=c.w/total*100);
  causes.sort((a,b)=>b.p-a.p);
  const top=causes.slice(0,4);
  // Prüfreihenfolge / Teile / Werkzeuge aggregiert (dedupe, Reihenfolge nach Wahrscheinlichkeit)
  const seen=new Set(); const collect=(k)=>{const r=[];top.forEach(c=>c[k].forEach(x=>{if(x&&x!=='—'&&!seen.has(k+x)){seen.add(k+x);r.push(x);}}));return r;};
  const tests=[]; const ts=new Set(); top.forEach(c=>c.tests.forEach(x=>{if(!ts.has(x)){ts.add(x);tests.push(x);}}));
  const parts=[]; const ps=new Set(); top.forEach(c=>c.parts.forEach(x=>{if(x&&x!=='—'&&!ps.has(x)){ps.add(x);parts.push(x);}}));
  const tools=[]; const ws=new Set(); top.forEach(c=>c.tools.forEach(x=>{if(x&&x!=='—'&&!ws.has(x)){ws.add(x);tools.push(x);}}));
  // Zeit & Reparaturwahrscheinlichkeit
  let timeMin=type==='phone'?30:60, timeMax=type==='phone'?60:120;
  if(water){timeMin+=30;timeMax+=60;}
  let repairProb = water?68:(fell?82:80); if(swollen)repairProb=Math.min(repairProb,60);
  // Sicherheit
  const safety=[];
  if((S.battery||volt||type!=='phone')&&(water||heat||swollen)) safety.push('Lithium-Ionen-Akku + '+(swollen?'Aufblähung':water?'Feuchtigkeit':'Überhitzung')+': Brand-/Verpuffungsgefahr. Akku vor dem Laden prüfen, aufgeblähte Akkus fachgerecht sichern und nicht weiterverwenden.');
  if(type!=='phone') safety.push('Hochstrom-/BMS-System: vor Arbeiten Akku trennen, auf Kurzschluss achten.');
  if(water&&type==='phone') safety.push('Bei Wasserkontakt Gerät nicht laden/einschalten bis das Board gereinigt und geprüft ist (Datenverlust-Risiko).');
  return {input:txt,type,brand,model,errorCode,volt,water,fell,top,tests,parts,tools,timeMin,timeMax,repairProb,safety};
}

function playCall(call){
  const isWa=call.channel==='whatsapp';
  openModal(`<div class="dhead"><b style="flex:1">${isWa?'Neue WhatsApp-Nachricht':'Eingehender Anruf'}</b><button class="btn sm gho" onclick="closeAll()">Schließen</button></div>
   <div class="dbody">

     <div class="callchat" id="callchat" style="margin-top:14px"></div>
     <div id="callfoot"></div>
   </div>`);
  let i=0; const other=isWa?'Kunde':'Anrufer';
  const step=()=>{
    const chat=document.getElementById('callchat'); if(!chat)return;
    if(i>=call.transcript.length){ finishCall(call); return; }
    const t=call.transcript[i];
    chat.insertAdjacentHTML('beforeend',`<div class="cb ${t.who==='ki'?'ki':'anr'}"><div class="lbl">${t.who==='ki'?'KI-Empfangskraft':other}</div>${esc(t.text)}</div>`);
    chat.scrollTop=chat.scrollHeight; i++; setTimeout(step,1400);
  };
  setTimeout(step,700);
}
function finishCall(call){
  if(call._book){const b=call._book;const c=ensureCustomer(b.name,b.tel,'');const nr='REP-'+(S.counter++);
    const o={id:uid('o'),nr,cid:c.id,brand:b.brand,model:b.model,issue:b.issue,qual:'Original',price:b.price,status:'offen',prio:'Standard',created:today(),due:b.appt,appt:b.appt,notes:(call.channel==='whatsapp'?'Per WhatsApp gebucht':'Telefonisch gebucht')+' (KI-Empfangskraft)',imei:'',readyAt:'',warranty:SHOP.warranty,sig:'',source:call.channel};
    S.ord.unshift(o);const r=S.rules.find(x=>x.id==='r_confirm');if(r&&r.on)logMail(o,r,'automatisch ('+CH[call.channel]+'-Buchung)');
    call.order=nr;call.result='Termin gebucht: '+b.model+' '+b.issue+', '+fmtDate(b.appt)+' 14:30'; delete call._book;}
  S.calls.unshift(call); save(); refreshBadges();
  const foot=document.getElementById('callfoot');
  if(foot) foot.innerHTML=`<div class="divider"></div><div class="note"><b>Automatisch erledigt:</b> ${esc(call.result)}${call.task?' · Rückruf-Aufgabe für das Team':''}${call.order?' · Auftrag '+call.order:''}</div>
    <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn gho" onclick="closeAll()">Schließen</button><button class="btn pri" onclick="closeAll();go('anrufe')">Zum Protokoll</button></div>`;
}

/* ============================ DEMO-TOUR ============================ */
let _demoStop=false,_demoT=null;
function demoBanner(txt,idx,total){
  let el=document.getElementById('democtl');
  if(!el){el=document.createElement('div');el.id='democtl';el.className='democtl';document.body.appendChild(el);}
  el.innerHTML='<div class="txt"><b>Demo-Tour</b> · Schritt '+idx+'/'+total+'<div style="opacity:.85;font-size:13px;max-width:60ch">'+txt+'</div></div><button class="stop" onclick="stopDemo()">Stopp</button>';
}
function stopDemo(){_demoStop=true; if(_demoT)clearTimeout(_demoT); const el=document.getElementById('democtl'); if(el)el.remove(); }
function startDemo(){
  _demoStop=true; if(_demoT)clearTimeout(_demoT); _demoStop=false;
  S.ord=S.ord.filter(o=>o.id!=='odemo');
  const c=S.cust[0];
  S.ord.unshift({id:'odemo',nr:'REP-DEMO',cid:c.id,brand:'Apple',model:'iPhone 13',issue:'Displaytausch',qual:'Original',price:129,status:'offen',prio:'Standard',created:today(),due:today(),appt:'',notes:'Demo-Auftrag',imei:'',readyAt:'',warranty:6,sig:'',source:''});
  save();
  const steps=[
    {t:'Neuer Auftrag angenommen: '+c.name+' · iPhone 13 · Displaytausch.',run:()=>{go('auftraege');openOrder('odemo');}},
    {t:'Status → In Bearbeitung. Der Kunde erhält automatisch die Eingangsbestätigung.',run:()=>{setStatus('odemo','bearbeitung');}},
    {t:'Ersatzteil fehlt → der Kunde wird informiert, für die Werkstatt entsteht eine Erinnerung.',run:()=>{setStatus('odemo','warten');}},
    {t:'Teil ist eingetroffen → die Reparatur läuft weiter.',run:()=>{setStatus('odemo','bearbeitung');}},
    {t:'Fertig! Der Kunde bekommt sofort die Abhol-Nachricht.',run:()=>{setStatus('odemo','fertig');}},
    {t:'Der Kunde verfolgt all das live auf seiner Status-Seite. Hier laufen die geplanten Erinnerungen auf.',run:()=>{closeAll();go('erinnerungen');remTab='queue';views.erinnerungen();paintIcons();}},
    {t:'Abgeholt & abgeschlossen. Einen Tag später folgt automatisch die Bewertungsanfrage.',run:()=>{go('auftraege');setStatus('odemo','abgeholt');}},
    {t:'Fertig. Jede versendete Nachricht ist im Verlauf protokolliert.',run:()=>{closeAll();go('erinnerungen');remTab='log';views.erinnerungen();paintIcons();}},
  ];
  let i=0;
  const tick=()=>{ if(_demoStop)return;
    const s=steps[i]; demoBanner(s.t,i+1,steps.length); s.run();
    i++;
    _demoT=setTimeout(i<steps.length?tick:demoDone,3000);
  };
  closeAll(); tick();
}
function demoDone(){ if(_demoStop)return; const el=document.getElementById('democtl');
  if(el)el.innerHTML='<div class="txt"><b>Demo-Tour beendet</b><div style="opacity:.85;font-size:13px">Sie können sie jederzeit erneut starten.</div></div><button class="stop" onclick="stopDemo()">Schließen</button>';
}
