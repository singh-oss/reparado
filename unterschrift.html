<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Unterschrift</title>
<link rel="icon" href="assets/favicon.svg">
<style>html,body{margin:0;background:#f4f7f5}</style>
</head>
<body>
<div id="sign-root"></div>
<script src="sign-page.js"></script>
<script>
(function(){
  var token=(location.hash||'').replace(/^#/,'');
  /* Token sofort aus der Adresszeile entfernen, damit er nicht im Verlauf oder beim Teilen auftaucht */
  if(token&&history.replaceState)history.replaceState(null,'',location.pathname);
  var root=document.getElementById('sign-root');
  if(!/^[A-Za-z0-9_-]{40,64}$/.test(token)){root.innerHTML='<p style="font:16px system-ui;padding:24px">Dieser Link ist ungültig. Bitte in der Werkstatt einen neuen QR-Code anzeigen lassen.</p>';return;}
  VelqioSignPage.render(root,VelqioSignPage.serverTransport(token));
})();
</script>
</body>
</html>
